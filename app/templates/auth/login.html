<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceder — JMSJyT Admin</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow border-0">
          <div class="card-header bg-primary text-white text-center py-4">
            <i class="bi bi-box-seam fs-1"></i>
            <h4 class="mt-2 mb-0 fw-bold">JMSJyT Admin</h4>
            <p class="mb-0 opacity-75 small">Panel de administración</p>
          </div>
          <div class="card-body p-4">

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
              {% endfor %}
            {% endwith %}

            <form method="POST" novalidate>
              {{ form.hidden_tag() if form is defined else '' }}
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

              <div class="mb-3">
                <label class="form-label fw-semibold" for="username">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" name="username"
                         autocomplete="username" required />
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password"
                         autocomplete="current-password" required />
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
</body>
</html>
