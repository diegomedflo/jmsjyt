<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JMSJyT — Acceder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <span class="login-brand">JMSJyT</span>
      </div>

      <h2 class="login-title">Bienvenido,<br>inicia sesión ahora</h2>

      <!-- Alertas -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="login-alert login-alert--{{ category }}">
          <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
        </div>
        {% endfor %}
      {% endwith %}

      <!-- Formulario -->
      <form method="POST" novalidate class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-field">
          <label for="username">Usuario</label>
          <div class="input-wrap">
            <i class="bi bi-person input-icon"></i>
            <input type="text" id="username" name="username"
                   placeholder="tu_usuario" autocomplete="username" required />
          </div>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" tabindex="-1"
                    onclick="togglePassword()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
