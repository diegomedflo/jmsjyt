# nixpacks.toml
#
# Nixpacks auto-detecta Python desde requirements.txt y corre
# "pip install -r requirements.txt" automáticamente (fase install).
# Solo agregamos la fase build para instalar el browser de Playwright.
# Mismo patrón que vasmat (que solo usa aptPkgs sin tocar install).

[phases.build]
cmds = ["playwright install chromium --with-deps"]

[start]
cmd = "gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"

